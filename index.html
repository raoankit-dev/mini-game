<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock-Paper-Cissor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section>
      <div class="main">
        <div class="box1 same-box">
          <div class="place user-place">
            <img src="/img/cissor.png" alt="img" class="userImg"/>
          </div>
          <div class="wraper">
            <div class="choice user-choice">
                <img class="rock" src="/img/rock.png" alt="rock" />
                <img class="paper" src="/img/paper.png" alt="paper" />
                <img class="cissor" src="/img/cissor.png" alt="cissor" />
            </div>
            <h2 class="user user-heading">User</h2>
          </div>
        </div>
        <div class="box3">
          <div class="wraper2">
            <p class="heading">ROCK|PAPER|CISSOR</p>
            <p class="winer">Start the Game!</p>
            <img src="/img/skechman.png" alt="info" class="man-in-middle" />
          </div>
          <h3 class="score"><span class="userScore">0</span> |SCORE| <span class="comScore">0</span></h3>
        </div>
        <div class="box2 same-box">
          <div class="place com-place">
            <img src="/img/paper.png" alt="img" class="compImg"/>
          </div>
          <div class="wraper">
            <div class="choice comoption">
                <img src="/img/rock.png" alt="rock" />
                <img src="/img/paper.png" alt="paper" />
                <img src="/img/cissor.png" alt="cissor" />
            </div>
            <h2 class="user com-heading">computer</h2>
          </div>
        </div>
      </div>
    </section>

    <script src="scrpit.js"></script>
  </body>
</html>
